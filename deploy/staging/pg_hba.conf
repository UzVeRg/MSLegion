# API и воркер могут подключаться только к рабочей базе, включая вход через сокет.
local mslegion_staging mslegion_api scram-sha-256
local all mslegion_api reject
host  mslegion_staging mslegion_api all scram-sha-256
host  all mslegion_api all reject

# Остальные роли сохраняют правила кластера, включая доступ для резервного копирования.
include /var/lib/postgresql/data/pg_hba.conf
