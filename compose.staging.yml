name: mslegion-staging

services:
  postgres:
    image: postgres:17-alpine
    command: ["postgres", "-c", "hba_file=/etc/postgresql/mslegion-pg_hba.conf"]
    environment:
      POSTGRES_USER: mslegion
      POSTGRES_DB: mslegion_staging
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD для стенда}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - type: bind
        source: ./deploy/staging/pg_hba.conf
        target: /etc/postgresql/mslegion-pg_hba.conf
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "mslegion", "-d", "mslegion_staging"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    image: ${COMPOSE_PROJECT_NAME}-api
    pull_policy: never
    environment:
      DATABASE_URL: postgresql+psycopg://mslegion@postgres:5432/mslegion_staging
      PGPASSWORD: ${POSTGRES_PASSWORD:?Задайте POSTGRES_PASSWORD для стенда}
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:?Задайте отдельный пароль роли API}
    command: ["python", "-m", "app.staging_migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: ./backend
    environment:
      APP_ENV: staging
      APP_HOST: 0.0.0.0
      DATABASE_URL: postgresql+psycopg://mslegion_api@postgres:5432/mslegion_staging
      PGPASSWORD: ${APP_DATABASE_PASSWORD:?Задайте отдельный пароль роли API}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      SUPPORT_FAQ: ${SUPPORT_FAQ:-null}
      SUPPORT_CONTACTS: ${SUPPORT_CONTACTS:-null}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      CALLBACK_API_KEY: ${CALLBACK_API_KEY:-}
      SERVER_STATUS_API_KEY: ${SERVER_STATUS_API_KEY:-}
      OWNER_IMAGE_QUOTA_BYTES: ${OWNER_IMAGE_QUOTA_BYTES:-134217728}
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/ready', timeout=2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12

  support-bot:
    profiles: ["support"]
    image: ${COMPOSE_PROJECT_NAME}-api
    pull_policy: never
    restart: unless-stopped
    environment:
      APP_ENV: staging
      DATABASE_URL: postgresql+psycopg://mslegion_api@postgres:5432/mslegion_staging
      PGPASSWORD: ${APP_DATABASE_PASSWORD:?Задайте отдельный пароль роли API}
      SUPPORT_BOT_TOKEN: ${SUPPORT_BOT_TOKEN:-}
      SUPPORT_ADMIN_IDS: ${SUPPORT_ADMIN_IDS:-[]}
      SUPPORT_FAQ: ${SUPPORT_FAQ:-null}
      SUPPORT_CONTACTS: ${SUPPORT_CONTACTS:-null}
    command: ["python", "-m", "app.telegram.support_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: caddy:2-alpine
    environment:
      STAGING_SITE_ADDRESS: ${STAGING_SITE_ADDRESS:-localhost}
    ports:
      - "${STAGING_BIND_ADDRESS:-127.0.0.1}:${STAGING_HTTP_PORT:-80}:80"
      - "${STAGING_BIND_ADDRESS:-127.0.0.1}:${STAGING_HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/staging/Caddyfile:/etc/caddy/Caddyfile:ro
      - type: bind
        source: ./frontend/dist
        target: /srv
        read_only: true
        bind:
          create_host_path: false
      - caddy_data:/data
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
