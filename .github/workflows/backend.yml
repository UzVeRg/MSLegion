name: Проверка серверной части

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mslegion_test
          POSTGRES_USER: mslegion
          POSTGRES_HOST_AUTH_METHOD: trust
        ports: ["127.0.0.1:5434:5432"]
        options: >-
          --health-cmd "pg_isready -U mslegion -d mslegion_test"
          --health-interval 2s --health-timeout 3s --health-retries 15
    defaults:
      run:
        working-directory: backend
    env:
      RUN_INTEGRATION_TESTS: "true"
      TEST_DATABASE_URL: postgresql+psycopg://mslegion@127.0.0.1:5434/mslegion_test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check .
      - run: python -m pytest -q
